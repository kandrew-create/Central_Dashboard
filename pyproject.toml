[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linker-scada-reporting"
version = "0.4.0"
description = "SCADA reporting foundation; not a deployed collector or production service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
collector = ["httpx>=0.27,<1", "tzdata>=2024.1", "cryptography>=44,<50", "pywin32>=306; sys_platform == 'win32'"]
test = ["pytest>=8,<9"]
local = ["cryptography>=44,<50", "psutil>=6,<8"]
manager = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "tzdata>=2024.1", "cryptography>=44,<50", "psutil>=6,<8", "pywin32>=306; sys_platform == 'win32'"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
scada-collector = "collector.cli:main"

[project.gui-scripts]
scada-collector-gui = "collector.gui:main"
scada-central-server = "server.management.entry:main"

[tool.setuptools.packages.find]
include = ["server*", "collector*", "shared*", "deploy*"]
exclude = ["server.tests*", "collector.tests*", "deploy.windows*"]

[tool.setuptools.package-data]
"server.migrations" = ["sql/*.sql", "script.py.mako"]
"collector" = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "collector/tests", "tests"]
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]
